name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_USER: anta
          POSTGRES_PASSWORD: integration-test-password
          POSTGRES_DB: anta_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U anta -d anta_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://anta:integration-test-password@127.0.0.1:5432/anta_test
      TEST_DATABASE_URL: postgresql://anta:integration-test-password@127.0.0.1:5432/anta_test
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-test-only-secret-do-not-use-in-production-32
      OTP_HASH_SECRET: ci-test-only-otp-secret-do-not-use-in-production
      SANDBOX_WEBHOOK_SECRET: ci-test-only-webhook-secret-not-production-32
      PAYMENT_PROVIDER: sandbox
      OTP_DELIVERY: development
      FCM_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run openapi
      - run: npm audit --omit=dev --audit-level=moderate
      - run: docker build -f infra/Dockerfile -t anta-backend:test .
